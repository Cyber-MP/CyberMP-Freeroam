services:
  server:
    container_name: cybermp-freeroam-dev
    image: ghcr.io/cyber-mp/server:latest
    # The upstream server runtime ships as linux/amd64 only. Pinning the platform
    # lets it run on Apple Silicon (arm64) Macs via Rosetta emulation, and is a
    # no-op on amd64 hosts (Intel Macs / Linux). See "Running on macOS" in README.
    platform: linux/amd64
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: development
      IS_DOCKER: "true"
    volumes:
      - ./server.toml:/cybermp/server.toml
      - ./resources:/cybermp/resources
      - ./crashdumps:/cybermp/crashdumps
      - ./logs:/cybermp/logs
    ports:
      - 2077:2077/tcp
      - 2077:2077/udp
